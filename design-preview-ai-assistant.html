<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8" />
<title>AI Assistant · 设计候选</title>
<link rel="stylesheet" href="src/design-system/tokens.css" />
<link rel="stylesheet" href="src/layouts/TopTabs.css" />
<link rel="stylesheet" href="src/components/ui/Button.css" />
<link rel="stylesheet" href="src/components/ui/TextField.css" />
<link rel="stylesheet" href="src/components/ui/IconButton.css" />
<link rel="stylesheet" href="src/components/navigation/SidebarSelect.css" />
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
<style>
/* ═══════════════════════ preview chrome ═══════════════════════ */
* { box-sizing:border-box; }
body { margin:0; padding:26px 24px 90px; background:var(--color-bg); color:var(--color-text); font-family:var(--font-sans); font-size:var(--text-sm); -webkit-font-smoothing:antialiased; }
.pv-head { max-width:1480px; margin:0 auto 22px; display:flex; align-items:flex-end; gap:18px; flex-wrap:wrap; }
.pv-head h1 { margin:0 0 4px; font-size:1.5rem; letter-spacing:-.02em; }
.pv-head p { margin:0; color:var(--color-text-muted); max-width:64ch; line-height:1.6; }
.pv-head .sp { flex:1; }
.pv-toggle { appearance:none; border:1px solid var(--color-border); background:var(--color-bg-elevated); color:var(--color-text); border-radius:999px; padding:7px 15px; font:inherit; font-weight:600; cursor:pointer; box-shadow:var(--shadow-sm); }
.pv-toggle:hover { border-color:color-mix(in srgb, var(--color-brand) 45%, var(--color-border)); color:var(--color-brand); }
.pv-grid { max-width:1480px; margin:0 auto; display:grid; gap:26px; }
.demo { border:1px solid var(--color-border); border-radius:var(--radius-lg); overflow:hidden; background:var(--color-bg); box-shadow:var(--shadow-sm); }
.demo__bar { display:flex; align-items:center; gap:10px; padding:11px 16px; background:var(--color-bg-elevated); border-bottom:1px solid var(--color-border); flex-wrap:wrap; }
.demo__no { width:24px; height:24px; flex:none; border-radius:8px; display:grid; place-items:center; background:var(--color-brand-soft); color:var(--color-brand); font-weight:700; font-size:var(--text-xs); }
.demo__name { font-weight:650; letter-spacing:-.01em; }
.demo__tags { margin-left:auto; display:flex; gap:7px; flex-wrap:wrap; }
.tagx { font-size:11px; font-weight:600; padding:3px 9px; border-radius:999px; background:var(--color-bg-muted); color:var(--color-text-muted); border:1px solid var(--color-border); }
.tagx--pick { background:var(--color-brand-soft); color:var(--color-brand); border-color:color-mix(in srgb, var(--color-brand) 25%, transparent); }
/* fake app frame so proportions read correctly */
.frame { display:flex; flex-direction:column; height:660px; background:var(--color-bg); overflow:hidden; }
.frame__header { display:flex; align-items:center; justify-content:space-between; padding:.6rem 1.15rem; background:color-mix(in srgb, var(--color-bg-elevated) 88%, transparent); border-bottom:1px solid var(--color-border); font-weight:650; color:var(--color-text-muted); flex:none; }
.frame__header .r { display:flex; gap:1rem; font-weight:500; }
.frame__tabs { flex:none; }
.pt-page { flex:1; min-height:0; display:flex; }

/* ═══════════════════════ shared AI atoms ═══════════════════════ */
.ico { width:1rem; height:1rem; flex:none; }
.ico--sm { width:.85rem; height:.85rem; }
.ai-sr { display:flex; align-items:center; gap:.5rem; }
.btn-quiet { appearance:none; border:0; background:transparent; color:var(--color-text-muted); font:inherit; font-size:var(--text-sm); font-weight:550; display:inline-flex; align-items:center; gap:.4rem; padding:.35rem .5rem; border-radius:8px; cursor:pointer; transition:background .15s ease, color .15s ease; }
.btn-quiet:hover { background:var(--color-bg-muted); color:var(--color-text); }
.btn-quiet.is-on { background:var(--color-brand-soft); color:var(--color-brand); }
.rail-title { font-size:10.5px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--color-text-muted); }
.scope-chip { display:inline-flex; align-items:center; gap:.35rem; padding:.2rem .5rem; border-radius:999px; background:var(--color-brand-soft); color:var(--color-brand); font-size:11px; font-weight:650; }
.meta-chip { display:inline-flex; align-items:center; gap:.3rem; padding:.15rem .45rem; border-radius:6px; background:var(--color-bg-muted); color:var(--color-text-muted); font-size:11px; font-weight:600; font-variant-numeric:tabular-nums; }
.doc-badge { display:inline-flex; align-items:center; padding:.1rem .4rem; border-radius:5px; font-size:10px; font-weight:700; letter-spacing:.02em; }
.doc-badge--con { background:#ecebff; color:#5148e5; }
.doc-badge--inv { background:#e0fbff; color:#0e7490; }
.doc-badge--pol { background:#fef3c7; color:#b45309; }
[data-theme='dark'] .doc-badge--con { background:rgba(124,115,255,.18); color:#b9b3ff; }
[data-theme='dark'] .doc-badge--inv { background:rgba(34,211,238,.16); color:#67e8f9; }
[data-theme='dark'] .doc-badge--pol { background:rgba(245,158,11,.18); color:#fcd34d; }
.tnum { font-variant-numeric:tabular-nums; }

/* threads */
.tl { display:flex; flex-direction:column; min-height:0; }
.tl__head { display:flex; align-items:center; gap:.5rem; padding:.85rem .9rem; border-bottom:1px solid var(--color-border); }
.tl__title { font-weight:700; letter-spacing:-.01em; }
.tl__scroll { flex:1; min-height:0; overflow:hidden; padding:.5rem .55rem 1rem; }
.tl__group { margin-top:.75rem; }
.tl__group > .rail-title { padding:0 .45rem .35rem; }
.tl__item { display:block; width:100%; text-align:left; appearance:none; border:0; background:transparent; font:inherit; color:var(--color-text); padding:.5rem .55rem; border-radius:9px; cursor:pointer; transition:background .14s ease; }
.tl__item:hover { background:var(--color-bg-muted); }
.tl__item.is-on { background:var(--color-brand-soft); }
.tl__item.is-on .tl__name { color:var(--color-brand); font-weight:650; }
.tl__name { display:block; font-size:var(--text-sm); font-weight:550; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.tl__sub { display:block; margin-top:2px; font-size:11px; color:var(--color-text-muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

/* conversation */
.cv { flex:1; min-width:0; min-height:0; display:flex; flex-direction:column; background:var(--color-bg); }
.cv__bar { flex:none; display:flex; align-items:center; gap:.6rem; padding:.7rem 1.1rem; border-bottom:1px solid var(--color-border); background:color-mix(in srgb, var(--color-bg-elevated) 82%, transparent); }
.cv__bar h2 { margin:0; font-size:var(--text-md); letter-spacing:-.01em; }
.cv__body { flex:1; min-height:0; overflow:hidden; padding:1.4rem 1.1rem 0; }
.cv__col { max-width:44rem; margin:0 auto; display:flex; flex-direction:column; gap:1.1rem; }
.cv__col--wide { max-width:64rem; }
.msg-user { align-self:flex-end; max-width:34rem; background:var(--color-brand-soft); color:var(--color-text); border-radius:14px 14px 4px 14px; padding:.65rem .85rem; line-height:1.6; }
.msg-ai { display:flex; flex-direction:column; gap:.7rem; }
.msg-ai__who { display:flex; align-items:center; gap:.45rem; font-size:11px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--color-text-muted); }
.msg-ai__mark { width:1.15rem; height:1.15rem; border-radius:6px; display:grid; place-items:center; background:var(--color-brand); color:#fff; }
.msg-ai__mark svg { width:.72rem; height:.72rem; }
.prose { line-height:1.72; }
.prose p { margin:0 0 .7rem; }
.prose p:last-child { margin-bottom:0; }
.prose strong { font-weight:650; }
.kv { display:flex; flex-wrap:wrap; gap:.5rem; margin:.1rem 0 .2rem; }
.kv__cell { flex:1 1 9rem; border:1px solid var(--color-border); border-radius:10px; padding:.5rem .65rem; background:var(--color-bg-elevated); }
.kv__k { display:block; font-size:10px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--color-text-muted); margin-bottom:.2rem; }
.kv__v { font-size:.95rem; font-weight:650; font-variant-numeric:tabular-nums; }
.cites { display:flex; gap:.3rem; flex-wrap:wrap; }
.cite { display:inline-flex; align-items:center; justify-content:center; min-width:1.15rem; height:1.15rem; padding:0 .3rem; border-radius:5px; background:var(--color-brand-soft); color:var(--color-brand); font-size:10.5px; font-weight:700; border:1px solid transparent; cursor:pointer; font-variant-numeric:tabular-nums; }
.cite:hover { border-color:color-mix(in srgb, var(--color-brand) 45%, transparent); }
/* provenance trace — the signature element */
.trace { border:1px solid var(--color-border); border-radius:10px; background:var(--color-bg-elevated); overflow:hidden; }
.trace__head { display:flex; align-items:center; gap:.5rem; padding:.45rem .7rem; font-size:11.5px; color:var(--color-text-muted); width:100%; background:none; border:0; font-family:inherit; cursor:pointer; text-align:left; }
.trace__dot { width:.4rem; height:.4rem; border-radius:50%; background:#10b981; flex:none; }
.trace__steps { display:flex; align-items:center; gap:.4rem; font-variant-numeric:tabular-nums; }
.trace__arrow { color:var(--color-border); }
.trace__body { border-top:1px solid var(--color-border); padding:.55rem .7rem; display:flex; flex-direction:column; gap:.45rem; }
.trace__row { display:flex; align-items:center; gap:.5rem; font-size:12px; color:var(--color-text-muted); }
.src { display:flex; gap:.6rem; padding:.55rem; border-radius:9px; border:1px solid transparent; }
.src:hover { background:var(--color-bg-muted); border-color:var(--color-border); }
.src__n { width:1.15rem; height:1.15rem; flex:none; border-radius:5px; background:var(--color-bg-muted); color:var(--color-text-muted); font-size:10.5px; font-weight:700; display:grid; place-items:center; }
.src__body { min-width:0; }
.src__t { display:block; font-weight:600; font-size:12.5px; margin-bottom:2px; }
.src__m { display:block; font-size:11px; color:var(--color-text-muted); }
.src__s { display:block; margin-top:.35rem; font-size:11.5px; color:var(--color-text-muted); line-height:1.55; border-left:2px solid var(--color-border); padding-left:.5rem; }
.rel { margin-left:auto; width:2.4rem; height:3px; border-radius:999px; background:var(--color-bg-muted); flex:none; overflow:hidden; }
.rel i { display:block; height:100%; background:var(--color-brand); }
/* composer */
.cv__composer { flex:none; padding:.9rem 1.1rem 1.1rem; }
.composer { max-width:44rem; margin:0 auto; border:1px solid var(--color-border); border-radius:14px; background:var(--color-bg-elevated); box-shadow:var(--shadow-sm); transition:border-color .15s ease, box-shadow .15s ease; }
.composer--wide { max-width:64rem; }
.composer:focus-within { border-color:var(--color-border-focus); box-shadow:0 0 0 3px var(--color-focus-ring); }
.composer__input { width:100%; border:0; background:transparent; color:var(--color-text); font:inherit; resize:none; padding:.7rem .85rem .35rem; outline:none; line-height:1.6; }
.composer__input::placeholder { color:var(--color-text-muted); }
.composer__foot { display:flex; align-items:center; gap:.4rem; padding:.4rem .55rem .5rem; }
.composer__spacer { flex:1; }
.send { width:1.9rem; height:1.9rem; border-radius:9px; border:0; background:var(--color-brand); color:#fff; display:grid; place-items:center; cursor:pointer; }
.send:hover { background:var(--color-brand-hover); }

/* knowledge pane (option C) */
.kb { display:flex; flex-direction:column; min-height:0; background:var(--color-bg-elevated); border-right:1px solid var(--color-border); }
.kb__head { padding:.8rem .85rem .6rem; border-bottom:1px solid var(--color-border); display:flex; flex-direction:column; gap:.55rem; }
.kb__scroll { flex:1; min-height:0; overflow:hidden; padding:.5rem .55rem 1rem; }
.kb__folder { border:0; background:none; width:100%; text-align:left; font:inherit; display:flex; align-items:center; gap:.45rem; padding:.42rem .5rem; border-radius:8px; cursor:pointer; color:var(--color-text); font-weight:550; }
.kb__folder:hover { background:var(--color-bg-muted); }
.kb__folder .n { margin-left:auto; font-size:11px; color:var(--color-text-muted); font-variant-numeric:tabular-nums; }
.kb__file { display:flex; align-items:flex-start; gap:.5rem; padding:.42rem .5rem .42rem 1.35rem; border-radius:8px; cursor:pointer; }
.kb__file:hover { background:var(--color-bg-muted); }
.kb__file.is-on { background:var(--color-brand-soft); }
.kb__file .t { font-size:12.5px; font-weight:550; display:block; }
.kb__file .m { font-size:11px; color:var(--color-text-muted); display:block; margin-top:1px; }
.check { width:.85rem; height:.85rem; flex:none; margin-top:.18rem; border:1.5px solid var(--color-border); border-radius:4px; display:grid; place-items:center; }
.kb__file.is-on .check { background:var(--color-brand); border-color:var(--color-brand); color:#fff; }
.check svg { width:.6rem; height:.6rem; opacity:0; }
.kb__file.is-on .check svg { opacity:1; }
</style>
</head>
<body>

<div class="pv-head">
  <div>
    <h1>AI Assistant · 设计候选</h1>
    <p>三种完整排版，都用项目真实 tokens / 组件 CSS 渲染。核心共性是「溯源轨」：每条回答带检索→引用的可展开轨迹，引用落到具体公司 + 文件 + 页/节。</p>
  </div>
  <div class="sp"></div>
  <button class="pv-toggle" id="themeBtn">切换深色 / 浅色</button>
</div>

<div class="pv-grid" id="grid"></div>

<script>
/* ═════════════ icons ═════════════ */
const S = (p) => `<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden>${p}</svg>`
const Ss = (p) => `<svg class="ico ico--sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden>${p}</svg>`
const I = {
  plus: S('<path d="M12 5v14M5 12h14"/>'),
  search: S('<circle cx="11" cy="11" r="7"/><path d="m16.2 16.2 4.3 4.3"/>'),
  send: S('<path d="M4.5 12h14"/><path d="m13 6.5 6 5.5-6 5.5"/>'),
  clip: S('<path d="M12.5 7.5 8 12a3.5 3.5 0 0 0 5 5l5-5a5 5 0 0 0-7-7l-5 5a7 7 0 0 0 10 10l3-3"/>'),
  chev: Ss('<path d="m6 9 6 6 6-6"/>'),
  chevr: Ss('<path d="m9 6 6 6-6 6"/>'),
  spark: S('<path d="M12 3.5 13.7 9l5.5 1.7-5.5 1.7L12 18l-1.7-5.6L4.8 10.7 10.3 9 12 3.5Z"/>'),
  doc: S('<path d="M7 3.5h7l4 4V20.5H7z"/><path d="M14 3.5v4h4"/>'),
  folder: S('<path d="M3.5 6.5h6l1.6 2h9.4v9.5H3.5z"/>'),
  copy: S('<rect x="9" y="9" width="11" height="11" rx="2"/><path d="M15 6.5V5a1.5 1.5 0 0 0-1.5-1.5H6.5A1.5 1.5 0 0 0 5 5v7.5A1.5 1.5 0 0 0 6.5 14H8"/>'),
  open: S('<path d="M14 4.5h5.5V10"/><path d="M19.5 4.5 11 13"/><path d="M18 14.5v4a1.5 1.5 0 0 1-1.5 1.5h-11A1.5 1.5 0 0 1 4 18.5v-11A1.5 1.5 0 0 1 5.5 6h4"/>'),
  check: Ss('<path d="m5 12.5 4.5 4.5L19 7"/>'),
}

const TABS = ['AI Assistant','AI Agents','Agent Manager','Knowledge','Automation','AI Settings']
const tabsHtml = () => `<nav class="top-tabs frame__tabs"><div class="top-tabs__inner">${TABS.map((t, i) => `<a class="top-tabs__tab${i === 0 ? ' top-tabs__tab--active' : ''}" href="#">${t}</a>`).join('')}</div></nav>`
const chrome = (inner) => `
  <div class="frame">
    <div class="frame__header"><span>AI Assistant</span><span class="r"><span>English</span><span>Manage MFA</span></span></div>
    ${tabsHtml()}
    <div class="pt-page">${inner}</div>
  </div>`

/* ═════════════ data ═════════════ */
const threads = [
  { g:'Acme Retail · 今天', items:[
    ['KUNZZ 付款条件是 NET 30 还是 45？','12 分钟前 · 4 份资料'],
    ['Invoice matching 的三条规则','1 小时前 · 2 份资料'],
  ]},
  { g:'Acme Retail · 更早', items:[
    ['Golden customer 的定义口径','昨天 · 3 份资料'],
    ['MFA 强制策略影响哪些角色','3 天前 · 5 份资料'],
  ]},
  { g:'KUNZZ HOLDINGS', items:[
    ['集团口径的合并报表范围','上周 · 6 份资料'],
  ]},
]
const threadList = (on = 0) => `
  <div class="tl__scroll">
    ${threads.map(({ g, items }) => `
      <div class="tl__group">
        <span class="rail-title">${g}</span>
        ${items.map(([n, m], i) => `<button class="tl__item${(on === 0 && g.includes('今天') && i === 0) ? ' is-on' : ''}"><span class="tl__name">${n}</span><span class="tl__sub">${m}</span></button>`).join('')}
      </div>`).join('')}
  </div>`

const sources = [
  { n:1, type:'con', label:'合同', t:'KUNZZ 主采购协议 2026', m:'Acme Retail · 2026-01-12 · p.4 §3.2 付款条款', s:'"...付款期限为发票签收后 30 日内（NET 30），逾期按 1.5%/月计息..."', rel:96 },
  { n:2, type:'inv', label:'发票', t:'INV-2026-0418 付款记录', m:'Acme Wholesale · 2026-04-18 · 字段 付款条件', s:'付款条件 = NET 45（例外：该供应商享有 45 天账期）', rel:88 },
  { n:3, type:'pol', label:'政策', t:'集团付款条件例外政策 v3', m:'KUNZZ HOLDINGS · 2026-03-02 · §2 例外审批', s:'例外账期须由集团财务总监审批，单笔上限 RM 500,000。', rel:71 },
]
const srcRow = (s) => `
  <div class="src">
    <span class="src__n">${s.n}</span>
    <span class="src__body">
      <span class="src__t"><span class="doc-badge doc-badge--${s.type}">${s.label}</span> ${s.t}</span>
      <span class="src__m">${s.m}</span>
      <span class="src__s">${s.s}</span>
    </span>
    <span class="rel"><i style="width:${s.rel}%"></i></span>
  </div>`

const answer = (wide) => `
  <div class="msg-ai">
    <span class="msg-ai__who"><span class="msg-ai__mark">${S('<path d="M12 3.5 13.7 9l5.5 1.7-5.5 1.7L12 18l-1.7-5.6L4.8 10.7 10.3 9 12 3.5Z"/>')}</span>Assistant · 依据 4 份资料</span>
    <div class="prose">
      <p>集团<strong>默认</strong>付款条件是 <strong>NET 30</strong>；但 <strong>KUNZZ HOLDINGS</strong> 作为集团母公司享有例外账期 <strong>NET 45</strong>，该例外已在 2026-03 政策中登记，不是合同漏洞。</p>
      <div class="kv">
        <span class="kv__cell"><span class="kv__k">默认账期</span><span class="kv__v">NET 30</span></span>
        <span class="kv__cell"><span class="kv__k">KUNZZ 例外</span><span class="kv__v">NET 45</span></span>
        <span class="kv__cell"><span class="kv__k">例外条款</span><span class="kv__v">2 份合同</span></span>
        <span class="kv__cell"><span class="kv__k">审批上限</span><span class="kv__v">RM 500,000</span></span>
      </div>
      <p>需要注意：例外仅在 2026-03 之后签发的发票生效，2026-01 的两笔仍按 NET 30 计算滞纳金。<span class="cites"><button class="cite">1</button><button class="cite">2</button><button class="cite">3</button></span></p>
    </div>
    <div class="trace">
      <button class="trace__head">
        <span class="trace__dot"></span>
        <span class="trace__steps">检索 1,284 段<span class="trace__arrow">→</span>命中 17 段<span class="trace__arrow">→</span>引用 3 份<span class="trace__arrow">→</span>耗时 2.4s</span>
        <span style="margin-left:auto;display:inline-flex;gap:.5rem;align-items:center">${I.chev}</span>
      </button>
      <div class="trace__body">
        ${sources.map(srcRow).join('')}
      </div>
    </div>
  </div>`

const userMsg = `<div class="msg-user">我们和 KUNZZ 的付款条件是 NET 30 还是 NET 45？合同里有例外吗？</div>`

const composer = (wide, scope) => `
  <div class="composer${wide ? ' composer--wide' : ''}">
    <textarea class="composer__input" rows="1" placeholder="继续追问，或粘贴单号、合同名…">${''}</textarea>
    <div class="composer__foot">
      <button class="btn-quiet">${I.clip}附件</button>
      ${scope ? `<span class="scope-chip">${I.folder}范围：Acme Retail · 全部已索引资料</span>` : `<button class="btn-quiet">Acme Retail · 全部资料 ${I.chev}</button>`}
      <span class="composer__spacer"></span>
      <button class="btn-quiet">仅基于资料回答</button>
      <button class="send" aria-label="发送">${I.send}</button>
    </div>
  </div>`

/* ═════════════ A · 三栏工作台 ═════════════ */
const optionA = `
  <div class="pt-page" style="height:100%">
    <aside class="tl" style="width:17rem;flex:none;border-right:1px solid var(--color-border);background:var(--color-bg-elevated)">
      <div class="tl__head">
        <span class="tl__title">会话</span>
