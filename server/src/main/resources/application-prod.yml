spring:
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/${DB_NAME}?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  sql:
    init:
      mode: never

auth:
  storage-key: ${AUTH_STORAGE_KEY}

app:
  frontend-url: ${FRONTEND_URL}
  local-merchant-id: ${LOCAL_MERCHANT_ID}
  mail:
    provider: resend
    from: ${EMAIL_FROM}
    resend:
      api-key: ${RESEND_API_KEY}
