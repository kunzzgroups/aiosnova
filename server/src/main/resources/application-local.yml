spring:
  config:
    import: optional:file:./.env.local[.properties]
  datasource:
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:aiosnova}?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
    username: ${DB_USERNAME:aiosnova_user}
    password: ${DB_PASSWORD}
  sql:
    init:
      mode: never

auth:
  storage-key: ${AUTH_STORAGE_KEY}

app:
  local-test-login:
    enabled: ${LOCAL_TEST_LOGIN_ENABLED:false}
    email: ${LOCAL_TEST_LOGIN_EMAIL:demo@aios.dev}
  local-merchant-id: ${LOCAL_MERCHANT_ID:00000000-0000-4000-8000-000000000002}
  mail:
    provider: ${EMAIL_PROVIDER:mock}
    from: ${EMAIL_FROM:AIOS <noreply@aiosnova.com>}
    resend:
      api-key: ${RESEND_API_KEY:}