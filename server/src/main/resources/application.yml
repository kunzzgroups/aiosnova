spring:
  application:
    name: aiosnova-server
  profiles:
    default: local

server:
  port: 8080

app:
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  test-login:
    enabled: ${TEST_LOGIN_ENABLED:false}
    email: ${TEST_LOGIN_EMAIL:}
    code-sha256: ${TEST_LOGIN_CODE_SHA256:}
    expires-at: ${TEST_LOGIN_EXPIRES_AT:}

auth:
  tac:
    resend-cooldown-seconds: 60

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
